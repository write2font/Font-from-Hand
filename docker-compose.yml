services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: font_from_hand
      MYSQL_USER: ffh
      MYSQL_PASSWORD: ffh_dev_password
      MYSQL_ROOT_PASSWORD: ffh_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uffh -pffh_dev_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/font_from_hand?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ffh
      SPRING_DATASOURCE_PASSWORD: ffh_dev_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FONT_ENGINE_HANDWRITE_USE_DOCKER: "false"
      FONT_ENGINE_HANDWRITE_ENGINE_DIR: /workspace/handwrite2350-engine
      FONT_ENGINE_LEGACY_PYTHON_COMMAND: python3
      FONT_ENGINE_HANDWRITE_WORKERS: "8"
      FONT_ENGINE_AI_USE_DOCKER: "false"
      FONT_ENGINE_AI_ENGINE_DIR: /workspace/fewshot-font-generation
      FONT_ENGINE_AI_PYTHON_COMMAND: python3
      FONT_ENGINE_AI_MODEL: DM
      FONT_ENGINE_AI_WEIGHT_PATH: write2font/pth/dm.pth
    volumes:
      - backend-uploads:/workspace/backend/uploads
      - ./autobiography:/workspace/autobiography
      - ./fewshot-font-generation/write2font/pth:/workspace/fewshot-font-generation/write2font/pth:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  handwrite2350:
    build:
      context: ./handwrite2350-engine
    image: handwrite2350:latest
    profiles:
      - tools
    command: ["--check-env"]
    volumes:
      - ./handwrite2350-engine/samples:/app/samples
      - ./handwrite2350-engine/outputs:/app/outputs

  write2font-ai:
    build:
      context: ./fewshot-font-generation
      dockerfile: Dockerfile.cpu
    image: write2font-ai:cpu
    profiles:
      - tools
    command: ["python", "-X", "utf8", "write2font/run_pipeline.py", "--help"]

volumes:
  backend-uploads:
  mysql-data:
