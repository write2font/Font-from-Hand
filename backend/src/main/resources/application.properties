spring.application.name=backend

# Local development database. Replace these values with MySQL settings via
# environment variables when running against a persistent database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:font_from_hand;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

font.engine.legacy.python-command=${FONT_ENGINE_LEGACY_PYTHON_COMMAND:python3}
font.engine.handwrite.use-docker=${FONT_ENGINE_HANDWRITE_USE_DOCKER:true}
font.engine.handwrite.docker-command=${FONT_ENGINE_HANDWRITE_DOCKER_COMMAND:docker}
font.engine.handwrite.docker-image=${FONT_ENGINE_HANDWRITE_DOCKER_IMAGE:handwrite2350:latest}
font.engine.handwrite.engine-dir=${FONT_ENGINE_HANDWRITE_ENGINE_DIR:}
font.engine.handwrite.workers=${FONT_ENGINE_HANDWRITE_WORKERS:8}

font.engine.ai.use-docker=${FONT_ENGINE_AI_USE_DOCKER:true}
font.engine.ai.docker-image=${FONT_ENGINE_AI_DOCKER_IMAGE:write2font-ai:cpu}
font.engine.ai.engine-dir=${FONT_ENGINE_AI_ENGINE_DIR:}
font.engine.ai.python-command=${FONT_ENGINE_AI_PYTHON_COMMAND:python}
font.engine.ai.model=${FONT_ENGINE_AI_MODEL:MX}
font.engine.ai.weight-path=${FONT_ENGINE_AI_WEIGHT_PATH:write2font/pth/last.pth}
