spring.application.name=backend

# MySQL is the only supported application database. Docker Compose provides
# these values for the backend container; local backend runs can point to the
# same Compose MySQL instance on localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/font_from_hand?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ffh}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ffh_dev_password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}
server.tomcat.max-swallow-size=${SERVER_TOMCAT_MAX_SWALLOW_SIZE:50MB}

font.engine.legacy.python-command=${FONT_ENGINE_LEGACY_PYTHON_COMMAND:python3}
font.engine.handwrite.use-docker=${FONT_ENGINE_HANDWRITE_USE_DOCKER:true}
font.engine.handwrite.docker-command=${FONT_ENGINE_HANDWRITE_DOCKER_COMMAND:docker}
font.engine.handwrite.docker-image=${FONT_ENGINE_HANDWRITE_DOCKER_IMAGE:handwrite2350:latest}
font.engine.handwrite.engine-dir=${FONT_ENGINE_HANDWRITE_ENGINE_DIR:}
font.engine.handwrite.workers=${FONT_ENGINE_HANDWRITE_WORKERS:8}

font.engine.ai.use-docker=${FONT_ENGINE_AI_USE_DOCKER:true}
font.engine.ai.docker-image=${FONT_ENGINE_AI_DOCKER_IMAGE:write2font-ai:cpu}
font.engine.ai.engine-dir=${FONT_ENGINE_AI_ENGINE_DIR:}
font.engine.ai.python-command=${FONT_ENGINE_AI_PYTHON_COMMAND:python}
font.engine.ai.model=${FONT_ENGINE_AI_MODEL:DM}
font.engine.ai.weight-path=${FONT_ENGINE_AI_WEIGHT_PATH:write2font/pth/dm.pth}
